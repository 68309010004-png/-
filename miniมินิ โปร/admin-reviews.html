<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review Management - MangaPick Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Noto+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/admin.css">
   
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
   
    <script src="js/admin-reviews.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body>
    <div class="admin-container" x-data="adminReviewsApp()" x-cloak>
        <header class="admin-header">
            <div>
                <h1><i class="fas fa-comments text-primary"></i> จัดการรีวิวมังงะ</h1>
                <p>ตรวจสอบ ดู แก้ไข และลบความคิดเห็นของผู้ใช้งาน</p>
            </div>
            <div style="display: flex; gap: 8px;">
                <a href="admin.html" class="btn-back"><i class="fas fa-cog"></i> การจัดการมังงะ</a>
                <a href="index.html" class="btn-back"><i class="fas fa-arrow-left"></i> กลับหน้าหลัก</a>
            </div>
        </header>

        <main class="admin-content">
            <section class="card-box">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; gap: 12px;">
                    <h2 class="card-title" style="margin-bottom: 0;">
                        รายการรีวิวทั้งหมด (<span x-text="filteredReviews.length"></span>)
                    </h2>
                    <input
                        type="text"
                        x-model="searchQuery"
                        placeholder="ค้นหาชื่อเรื่อง, อีเมล หรือรีวิว..."
                        class="form-control"
                        style="max-width: 280px;"
                    >
                </div>

                <div class="manga-table-wrapper">
                    <table class="manga-table">
                        <thead>
                            <tr>
                                <th>มังงะ</th>
                                <th>ผู้รีวิว</th>
                                <th>คะแนน</th>
                                <th>ข้อความรีวิว</th>
                                <th>วันที่</th>
                                <th>จัดการ</th>
                            </tr>
                        </thead>
                        <tbody>
                            <template x-for="review in filteredReviews" :key="review.id">
                                <tr>
                                    <td x-text="review.mangaTitle" style="font-weight: 600;"></td>
                                    <td x-text="review.userEmail" style="color: #64748b; font-size: 0.8rem;"></td>
                                    <td>
                                        <span style="color: #f59e0b; font-weight: 700;">
                                            <i class="fas fa-star"></i> <span x-text="review.rating"></span>
                                        </span>
                                    </td>
                                    <td x-text="review.comment" style="max-width: 250px; word-break: break-word;"></td>
                                    <td x-text="review.createdAt" style="color: #94a3b8; font-size: 0.75rem;"></td>
                                    <td>
                                        <button class="btn-icon edit" @click="openEditModal(review)" title="แก้ไขรีวิว">
                                            <i class="fas fa-edit"></i>
                                        </button>
                                        <button class="btn-icon delete" @click="deleteReview(review.id)" title="ลบรีวิว">
                                            <i class="fas fa-trash"></i>
                                        </button>
                                    </td>
                                </tr>
                            </template>
                            <template x-if="filteredReviews.length === 0">
                                <tr>
                                    <td colspan="6" style="text-align: center; color: #94a3b8; padding: 24px;">
                                        ไม่พบข้อมูลรีวิวในระบบ
                                    </td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
            </section>
        </main>

        <!-- Modal แก้ไขรีวิว -->
        <div class="modal-overlay" x-show="isEditModalOpen" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 100;" x-transition>
            <div class="card-box" style="width: 100%; max-width: 450px; background: white; border-radius: 16px; padding: 24px;">
                <h3 style="margin-bottom: 16px; font-size: 1.1rem;">แก้ไขรีวิว</h3>
                <form @submit.prevent="saveEdit()">
                    <div class="form-group">
                        <label>คะแนน (1 - 5 ดาว)</label>
                        <select x-model="editForm.rating" class="form-control" required>
                            <option value="5">5 ดาว - ดีเยี่ยม</option>
                            <option value="4">4 ดาว - ดีมาก</option>
                            <option value="3">3 ดาว - ปานกลาง</option>
                            <option value="2">2 ดาว - พอใช้</option>
                            <option value="1">1 ดาว - ควรปรับปรุง</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>ข้อความรีวิว</label>
                        <textarea x-model="editForm.comment" rows="4" class="form-control" placeholder="ข้อความรีวิว..." required></textarea>
                    </div>
                    <div class="form-actions" style="margin-top: 20px;">
                        <button type="submit" class="btn-primary">บันทึกการแก้ไข</button>
                        <button type="button" class="btn-secondary" @click="closeEditModal()">ยกเลิก</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
