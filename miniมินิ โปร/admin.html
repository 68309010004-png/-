<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - MangaPick</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Noto+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/admin.css">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    
    <script src="js/admin.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body>

    <div class="admin-container" x-data="adminApp()" x-cloak>
        <header class="admin-header">
            <div>
                <h1>Admin Dashboard</h1>
                <p>จัดการมังงะและรายการในระบบ</p>
            </div>
            <div style="display: flex; gap: 8px; align-items: center;">
            <a href="admin-reviews.html" class="btn-back" style="background: #e0e7ff; color: #4338ca;">
            <i class="fas fa-comments"></i> จัดการรีวิว
            </a>
            <a href="index.html" class="btn-back"><i class="fas fa-arrow-left"></i> กลับหน้าหลัก</a>
        </header>

        <main class="admin-content">
            <!-- Form เพิ่ม / แก้ไข มังงะ -->
            <section class="card-box">
                <h2 class="card-title" x-text="isEdit ? 'แก้ไขมังงะ' : 'เพิ่มมังงะใหม่'"></h2>
                
                <form @submit.prevent="saveManga">
                    <div class="form-group">
                        <label>ชื่อเรื่อง (Title)</label>
                        <input type="text" x-model="form.title" placeholder="เช่น One Piece" required class="form-control">
                    </div>

                    <div class="form-group-row">
                        <div class="form-group">
                            <label>ผู้แต่ง (Author)</label>
                            <input type="text" x-model="form.author" placeholder="เช่น Eiichiro Oda" required class="form-control">
                        </div>
                        <div class="form-group">
                            <label>หมวดหมู่ (Category)</label>
                            <select x-model="form.category" required class="form-control">
                                <option value="Action">Action</option>
                                <option value="Fantasy">Fantasy</option>
                                <option value="Sci-Fi">Sci-Fi</option>
                                <option value="Comedy">Comedy</option>
                                <option value="Romance">Romance</option>
                                <option value="Drama">Drama</option>
                                <option value="Horror">Horror</option>
                                <option value="Mystery">Mystery</option>
                                <option value="Sports">Sports</option>
                                <option value="Isekai">Isekai</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>ลิงก์เว็บซื้อเล่ม/E-Book (Buy URL)</label>
                        <input type="url" x-model="form.buyUrl" placeholder="https://www.mebmarket.com/..." class="form-control">
                    </div>

                    <div class="form-group">
                        <label>URL รูปปก (Cover Image URL)</label>
                        <input type="url" x-model="form.cover" placeholder="https://..." required class="form-control">
                    </div>

                    <div class="form-group">
                        <label>เรื่องย่อ (Synopsis)</label>
                        <textarea x-model="form.synopsis" rows="4" placeholder="กรอกเรื่องย่อ..." class="form-control"></textarea>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn-primary" x-text="isEdit ? 'อัปเดตข้อมูล' : 'บันทึกมังงะ'"></button>
                        <button type="button" class="btn-secondary" x-show="isEdit" @click="resetForm()">ยกเลิก</button>
                    </div>
                </form>
            </section>

            <!-- รายการมังงะที่มีในระบบ -->
            <section class="card-box" style="margin-top: 24px;">
                <h2 class="card-title">รายการมังงะทั้งหมด (<span x-text="mangas.length"></span>)</h2>
                
                <div class="manga-table-wrapper">
                    <table class="manga-table">
                        <thead>
                            <tr>
                                <th>รูปปก</th>
                                <th>ชื่อเรื่อง</th>
                                <th>ผู้แต่ง</th>
                                <th>หมวดหมู่</th>
                                <th>ลิงก์ซื้อ</th>
                                <th>จัดการ</th>
                            </tr>
                        </thead>
                        <tbody>
                            <template x-for="manga in mangas" :key="manga.id">
                                <tr>
                                    <td><img :src="manga.cover" class="table-img"></td>
                                    <td x-text="manga.title" style="font-weight: 600;"></td>
                                    <td x-text="manga.author"></td>
                                    <td><span class="badge" x-text="manga.category"></span></td>
                                    <td>
                                        <template x-if="manga.buyUrl">
                                            <a :href="manga.buyUrl" target="_blank" class="link-buy"><i class="fas fa-external-link-alt"></i> ดูลิงก์</a>
                                        </template>
                                        <template x-if="!manga.buyUrl">
                                            <span style="color: #ccc;">-</span>
                                        </template>
                                    </td>
                                    <td>
                                        <button class="btn-icon edit" @click="editManga(manga)"><i class="fas fa-edit"></i></button>
                                        <button class="btn-icon delete" @click="deleteManga(manga.id)"><i class="fas fa-trash"></i></button>
                                    </td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

</body>
</html>
