<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Library - MangaPick</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Noto+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- ใช้ CSS ตัวเดียวกับ Home เพื่อความสอดคล้องทั้ง Mobile และ PC -->
    <link rel="stylesheet" href="css/home.css">

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/favorites.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body>

    <div class="app-container" x-data="favoritesApp()" x-cloak>
        
        <!-- App Header -->
        <header class="app-header">
            <div class="header-top">
                <h1 class="brand-logo"><i class="fas fa-heart text-danger"></i> My Library</h1>
                
                <div class="user-profile">
                    <template x-if="userRole === 'superadmin'">
                        <a href="superadmin.html" class="btn-admin-link" style="background: #fee2e2; color: #dc2626;">
                            <i class="fas fa-user-shield"></i> Super Admin
                        </a>
                    </template>
                    <template x-if="userRole === 'admin' || userRole === 'superadmin'">
                        <a href="admin.html" class="btn-admin-link">
                            <i class="fas fa-cog"></i> Admin
                        </a>
                    </template>
                    <button @click="logout()" class="logout-btn">ออกจากระบบ</button>
                </div>
            </div>
            
            <p class="user-email" x-text="userEmail || 'คลังมังงะส่วนตัวของคุณ'"></p>

            <!-- Search Box ในคลังโปรด -->
            <div class="search-box">
                <i class="fas fa-search search-icon"></i>
                <input type="text" x-model="searchQuery" placeholder="ค้นหามังงะที่บันทึกไว้..." class="search-input">
            </div>
        </header>

        <!-- Content Grid List -->
        <main class="manga-grid">
            <template x-for="manga in filteredFavorites" :key="manga.id">
                <div class="manga-card" @click="openModal(manga)">
                    <div class="manga-cover-wrapper">
                        <img :src="manga.cover || 'https://via.placeholder.com/300x400?text=No+Cover'" :alt="manga.title" class="manga-img">
                        <button class="fav-btn is-fav" @click.stop="removeFavorite(manga.id)">
                            <i class="fas fa-heart"></i>
                        </button>
                    </div>
                    <div class="manga-info">
                        <h3 class="manga-title" x-text="manga.title"></h3>
                        <p class="manga-author" x-text="manga.author"></p>
                    </div>
                </div>
            </template>

            <!-- Empty State ถ้ายังไม่มีมังงะในคลัง -->
            <div class="empty-state" x-show="filteredFavorites.length === 0">
                <div class="empty-icon"><i class="fas fa-bookmark"></i></div>
                <p x-text="searchQuery ? 'ไม่พบมังงะที่ค้นหา' : 'ยังไม่มีมังงะในคลังโปรดของคุณ'"></p>
            </div>
        </main>

        <!-- Bottom Navigation -->
        <nav class="bottom-nav">
            <a href="index.html" class="nav-item">
                <i class="fas fa-home"></i>
                <span>Home</span>
            </a>
            <a href="favorites.html" class="nav-item active">
                <i class="fas fa-heart"></i>
                <span>My Library</span>
            </a>
        </nav>

        <!-- Modal Popup ดูรายละเอียด -->
        <div class="modal-overlay" x-show="selectedManga" x-transition.opacity @click.self="closeModal()">
            <div class="modal-content" x-show="selectedManga" x-transition.scale>
                <button class="modal-close-btn" @click="closeModal()">&times;</button>
                <template x-if="selectedManga">
                    <div>
                        <div class="modal-cover-box">
                        <img :src="selectedManga.cover" :alt="selectedManga.title" class="modal-cover-img">
                    </div>
                    <h2 class="modal-title" x-text="selectedManga.title"></h2>
                    <p class="modal-author" x-text="'ผู้แต่ง: ' + selectedManga.author"></p>
                    <div class="modal-synopsis">
                        <strong style="display:block; margin-bottom: 4px;">เรื่องย่อ:</strong>
                        <span x-text="selectedManga.synopsis || 'ไม่มีข้อมูลเรื่องย่อ'"></span>
                    </div>
                    <template x-if="selectedManga && selectedManga.buyUrl">
                        <a :href="selectedManga.buyUrl" target="_blank" class="btn-buy-manga">
                            <i class="fas fa-shopping-cart"></i> ซื้อเล่มลิขสิทธิ์ / อ่านเพิ่ม
                        </a>
                    </template>
                    </div>
                </template>
            </div>
        </div>

    </div>

</body>
</html>
