<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Library - MangaPick</title>
    <meta name="referrer" content="no-referrer">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Noto+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/favorites.css">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    
    <script src="js/favorites.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body>

    <div class="app-container" x-data="favoritesApp()" x-cloak>
        
        <!-- Header Section -->
        <header class="app-header">
            <h1 class="brand-logo">My Library</h1>
            <p class="user-email">คลังเก็บมังงะส่วนตัวของคุณ</p>
        </header>

        <!-- Main Content (2 Columns Grid) -->
        <main class="manga-grid">
            <template x-for="manga in favoriteMangas" :key="manga.docId">
                <div class="manga-card" @click="openModal(manga)">
                    <div class="manga-cover-wrapper">
                        <img 
                            :src="manga.cover" 
                            :alt="manga.title" 
                            class="manga-img"
                            onerror="this.onerror=null; this.src='https://images.weserv.nl/?url=https://i.pinimg.com/736x/8f/3e/68/8f3e68f3074360e206b12a83e0c031d2.jpg';"
                        />
                        <!-- ปุ่มลบออกจากรายการโปรด -->
                        <button 
                            class="fav-btn is-fav" 
                            @click.stop="removeFavorite(manga.docId)">
                            <i class="fas fa-heart"></i>
                        </button>
                    </div>
                    <div class="manga-info">
                        <h3 class="manga-title" x-text="manga.title"></h3>
                        <p class="manga-author" x-text="manga.author || 'มังงะโปรด'"></p>
                    </div>
                </div>
            </template>

            <!-- แสดงเมื่อไม่มีรายการโปรด -->
            <template x-if="favoriteMangas.length === 0 && !loading">
                <div class="empty-state">
                    <i class="far fa-heart empty-icon"></i>
                    <p class="empty-title">ยังไม่มีมังงะในคลังโปรด</p>
                    <p class="empty-desc">กดรูปหัวใจที่มังงะในหน้าหลัก เพื่อบันทึกเก็บไว้ดูที่นี่ได้เลย!</p>
                    <a href="index.html" class="btn-go-home">ไปเลือกมังงะ</a>
                </div>
            </template>

            <!-- แสดงขณะกำลังโหลด -->
            <template x-if="loading">
                <div style="grid-column: 1/-1; text-align: center; padding: 40px; color: #888;">
                    <p>⏳ กำลังโหลดรายการโปรด...</p>
                </div>
            </template>
        </main>

        <!-- Navigation Bar -->
        <nav class="bottom-nav">
            <a href="index.html" class="nav-item">
                <i class="fas fa-home"></i>
                <span>Home</span>
            </a>
            <a href="favorites.html" class="nav-item active">
                <i class="fas fa-heart"></i>
                <span>My Library</span>
            </a>
        </nav>

        <!-- Modal แสดงรายละเอียดเรื่องย่อ (แก้ไข Syntax แล้ว) -->
        <div class="modal-overlay" x-show="showModal" @click.self="closeModal()" x-transition>
            <div class="modal-content" x-show="showModal" x-transition>
                <button class="modal-close-btn" @click="closeModal()">&times;</button>
                <template x-if="selectedManga">
                    <div>
                        <div class="modal-cover-box">
                            <img :src="selectedManga.cover" :alt="selectedManga.title" class="modal-cover-img">
                        </div>
                        <h2 class="modal-title" x-text="selectedManga.title"></h2>
                        <p class="modal-author" x-text="'ผู้แต่ง: ' + (selectedManga.author || 'ไม่ระบุ')"></p>
                        
                        <div class="modal-synopsis">
                            <h4>เรื่องย่อ</h4>
                            <p x-text="selectedManga.synopsis || 'ไม่มีข้อมูลเรื่องย่อ'"></p>
                        </div>
                    </div>
                </template>
            </div>
        </div>

    </div>

</body>
</html>
