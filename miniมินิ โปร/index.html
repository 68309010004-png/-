<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MangaPick - Premium Manga Tracker</title>
    <meta name="referrer" content="no-referrer">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Noto+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/home.css">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    
    <script src="js/home.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body>

    <div class="app-container" x-data="homeApp()" x-cloak>
        
        <!-- Header Section -->
        <header class="app-header">
            <div class="header-top">
                <h1 class="brand-logo">MangaPick</h1>
                <div class="user-profile">
                    <a href="admin.html" class="btn-admin-link"><i class="fas fa-cog"></i> Admin</a>
                    <button @click="logout()" class="logout-btn">ออกจากระบบ</button>
                </div>
            </div>
            <p class="user-email" x-text="currentUser ? currentUser.email : 'กำลังโหลด...'"></p>

            <!-- Search Bar -->
            <div class="search-box">
                <i class="fas fa-search search-icon"></i>
                <input 
                    type="text" 
                    placeholder="ค้นหาชื่อเรื่องหรือผู้แต่ง..." 
                    x-model="searchQuery" 
                    class="search-input"
                >
            </div>

            <!-- Filter Pills -->
            <div class="filter-scroll">
                <button 
                    class="filter-pill" 
                    :class="{ 'active': selectedCategory === 'All' }"
                    @click="selectedCategory = 'All'">All</button>
                <button 
                    class="filter-pill" 
                    :class="{ 'active': selectedCategory === 'Action' }"
                    @click="selectedCategory = 'Action'">Action</button>
                <button 
                    class="filter-pill" 
                    :class="{ 'active': selectedCategory === 'Fantasy' }"
                    @click="selectedCategory = 'Fantasy'">Fantasy</button>
                <button 
                    class="filter-pill" 
                    :class="{ 'active': selectedCategory === 'Sci-Fi' }"
                    @click="selectedCategory = 'Sci-Fi'">Sci-Fi</button>
                <button 
                    class="filter-pill" 
                    :class="{ 'active': selectedCategory === 'Comedy' }"
                    @click="selectedCategory = 'Comedy'">Comedy</button>
            </div>
        </header>

        <!-- Main Content (Manga Grid) -->
        <main class="manga-grid">
            <template x-for="manga in filteredMangas" :key="manga.id">
                <div class="manga-card" @click="openModal(manga)">
                    <div class="manga-cover-wrapper">
                        <img 
                            :src="manga.cover" 
                            :alt="manga.title" 
                            class="manga-img"
                            onerror="this.onerror=null; this.src='https://images.weserv.nl/?url=https://i.pinimg.com/736x/8f/3e/68/8f3e68f3074360e206b12a83e0c031d2.jpg';"
                        />
                        <button 
                            class="fav-btn" 
                            :class="{ 'is-fav': isFavorite(manga.id) }" 
                            @click.stop="toggleFavorite(manga)">
                            <i class="fas fa-heart"></i>
                        </button>
                    </div>
                    <div class="manga-info">
                        <h3 class="manga-title" x-text="manga.title"></h3>
                        <p class="manga-author" x-text="manga.author"></p>
                    </div>
                </div>
            </template>

            <!-- แสดงเมื่อค้นหาไม่พบ -->
            <template x-if="filteredMangas.length === 0 && !loading">
                <div class="empty-state">
                    <i class="fas fa-search empty-icon"></i>
                    <p class="empty-title">ไม่พบมังงะที่คุณค้นหา</p>
                </div>
            </template>
        </main>

        <!-- Navigation Bar -->
        <nav class="bottom-nav">
            <a href="index.html" class="nav-item active">
                <i class="fas fa-home"></i>
                <span>Home</span>
            </a>
            <a href="favorites.html" class="nav-item">
                <i class="fas fa-heart"></i>
                <span>My Library</span>
            </a>
        </nav>

        <!-- Modal เรื่องย่อ + ปุ่มสั่งซื้อเล่มแท้ -->
        <div class="modal-overlay" x-show="showModal" @click.self="closeModal()" x-transition>
            <div class="modal-content" x-show="showModal" x-transition>
                <button class="modal-close-btn" @click="closeModal()">&times;</button>
                <template x-if="selectedManga">
                    <div>
                        <div class="modal-cover-box">
                            <img :src="selectedManga.cover" :alt="selectedManga.title" class="modal-cover-img">
                        </div>
                        <h2 class="modal-title" x-text="selectedManga.title"></h2>
                        <p class="modal-author" x-text="'ผู้แต่ง: ' + (selectedManga.author || 'ไม่ระบุ')"></p>
                        
                        <div class="modal-synopsis">
                            <h4>เรื่องย่อ</h4>
                            <p x-text="selectedManga.synopsis || 'ไม่มีข้อมูลเรื่องย่อ'"></p>
                        </div>

                        <!-- ปุ่มวาร์ปไปซื้อเล่มลิขสิทธิ์ -->
                        <template x-if="selectedManga.buyUrl">
                            <a :href="selectedManga.buyUrl" target="_blank" rel="noopener" class="btn-buy-manga">
                                <i class="fas fa-shopping-cart"></i>
                                <span>สั่งซื้อเล่มลิขสิทธิ์ / E-Book</span>
                                <i class="fas fa-external-link-alt" style="font-size: 0.75rem;"></i>
                            </a>
                        </template>
                    </div>
                </template>
            </div>
        </div>

    </div>

</body>
</html>
