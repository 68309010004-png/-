<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In / Sign Up - MangaPick</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Noto+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/auth.css">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    
    <script src="js/auth.js" defer></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body>

    <div class="auth-container" x-data="authApp()" x-cloak>
        <div class="auth-card">
            
            <!-- ปุ่มย้อนกลับหน้าหลัก (วางมุมซ้ายบนของการ์ด) -->
            <a href="index.html" class="btn-back-home">
                <i class="fas fa-arrow-left"></i>
                <span>หน้าหลัก</span>
            </a>

            <!-- Header ของการ์ด -->
            <div class="auth-header">
                <h1 class="brand-logo">MangaPick</h1>
                <p class="auth-subtitle" x-text="isSignUp ? 'สร้างบัญชีใหม่เพื่อเริ่มสะสมมังงะ' : 'เข้าสู่ระบบคลังมังงะส่วนตัวของคุณ'"></p>
            </div>

            <!-- ฟอร์มเข้าสู่ระบบ / สมัครสมาชิก -->
            <form @submit.prevent="handleSubmit()" class="auth-form">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" x-model="email" placeholder="name@example.com" required class="form-input">
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <input type="password" x-model="password" placeholder="••••••••" required class="form-input">
                </div>

                <button type="submit" class="btn-submit" x-text="isSignUp ? 'สมัครสมาชิก' : 'เข้าสู่ระบบ'"></button>
            </form>

            <!-- ปุ่มสลับโหมด Sign In / Sign Up -->
            <div class="auth-toggle">
                <button type="button" @click="isSignUp = !isSignUp" class="btn-toggle-mode">
                    <span x-text="isSignUp ? 'มีบัญชีอยู่แล้ว? เข้าสู่ระบบที่นี่' : 'ยังไม่มีบัญชีใช่ไหม? สมัครสมาชิกที่นี่'"></span>
                </button>
            </div>

        </div>
    </div>

</body>
</html>
