<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In / Sign Up - MangaPick</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Noto+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/auth.css">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    
    <script src="js/auth.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body>

    <div class="auth-container" x-data="authApp()" x-cloak>
        <div class="auth-card">
            <h1 class="auth-brand">MangaPick</h1>
            <p class="auth-subtitle" x-text="isSignUp ? 'สร้างบัญชีใหม่เพื่อสะสมมังงะ' : 'เข้าสู่ระบบคลังมังงะส่วนตัวของคุณ'"></p>

            <!-- ปุ่ม Google Sign-In -->
            <button type="button" @click="loginWithGoogle()" class="btn-google">
                <i class="fab fa-google" style="color: #ea4335; font-size: 1.1rem;"></i>
                <span x-text="isSignUp ? 'สมัครสมาชิกด้วย Google' : 'เข้าสู่ระบบด้วย Google'"></span>
            </button>

            <div class="divider">
                <span>หรือ</span>
            </div>

            <!-- Form ล็อกอิน/สมัครปกติ -->
            <form @submit.prevent="handleSubmit()" class="auth-form">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" x-model="email" placeholder="example@email.com" required class="form-control">
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <input type="password" x-model="password" placeholder="••••••••" required class="form-control">
                </div>

                <button type="submit" class="btn-submit" x-text="isSignUp ? 'สมัครสมาชิก' : 'เข้าสู่ระบบ'"></button>
            </form>

            <div class="auth-toggle">
                <p>
                    <span x-text="isSignUp ? 'มีบัญชีอยู่แล้ว?' : 'ยังไม่มีบัญชีใช่ไหม?'"></span>
                    <a href="#" @click.prevent="isSignUp = !isSignUp" x-text="isSignUp ? 'เข้าสู่ระบบที่นี่' : 'สมัครสมาชิกที่นี่'"></a>
                </p>
            </div>
        </div>
    </div>

</body>
</html>
